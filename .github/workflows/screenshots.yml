name: 📸 Auto-Update Screenshots

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'test/screenshots/**'
      - 'test/assets/**'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-screenshots:
    name: 🎨 Generate & Commit Screenshots
    runs-on: ubuntu-latest

    steps:
      - name: 🧑‍💻 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 📸 Generate Golden Screenshots
        run: flutter test --update-goldens test/screenshots/generate_screenshots_test.dart

      - name: 🚀 Commit & Push Updated Screenshots
        run: |
          if [ -n "$(git status --porcelain docs/screenshots)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots/
            git commit -m "docs: auto-update screenshots from CI [skip ci]"
            git push origin HEAD:main
          else
            echo "✅ Aucune capture d'écran modifiée. README déjà synchronisé !"
          fi
