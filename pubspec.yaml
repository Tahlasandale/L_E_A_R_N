name: learn_flashcards
description: "Application Kawaii Flashcards FSRS en Flutter"
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#181926"
  adaptive_icon_foreground: "assets/icon/app_logo.png"
  web:
    generate: true
    image_path: "assets/icon/app_logo.png"
